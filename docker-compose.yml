services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ghostlink-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - falkordb_data:/var/lib/falkordb
volumes:
  falkordb_data:
